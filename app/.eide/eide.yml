version: "4.1"
name: app
type: ARM
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Core
      files:
        - path: core/main.c
        - path: core/stm32f4xx_it.c
      folders: []
    - name: Modules
      files:
        - path: modules/led/led.c
        - path: modules/key/key.c
        - path: modules/systick/systick.c
      folders: []
    - name: CMSIS
      files:
        - path: libraries/cmsis/startup/startup_stm32f40_41xxx.s
        - path: libraries/cmsis/system/system_stm32f4xx.c
      folders: []
    - name: StdPeriph
      files:
        - path: libraries/stdperiph/src/misc.c
        - path: libraries/stdperiph/src/stm32f4xx_gpio.c
        - path: libraries/stdperiph/src/stm32f4xx_rcc.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 8c2e5f1a9d4b7e3c6a0f2d8b5e1c4f9a
targets:
  app:
    cppPreprocessAttrs:
      defineList:
        - STM32F411xE
        - USE_STDPERIPH_DRIVER
      incList:
        - core
        - config
        - modules/board
        - modules/led
        - modules/key
        - modules/systick
        - modules/bootapi
        - libraries/cmsis/inc
        - libraries/cmsis/system
        - libraries/stdperiph/inc
        - .cmsis/include
        - RTE/_app
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: unspecified
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes: []
            output-format: elf
            ro-base: "0x08004000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x0003C000"
                startAddr: "0x08004000"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08004000"
        bin: ""
        elFile: None
        optionBytes: .eide/app.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
