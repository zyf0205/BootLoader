version: "4.1"
name: bootloader
type: ARM
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Core
      files:
        - path: core/main.c
        - path: core/stm32f4xx_it.c
      folders: []
    - name: Config
      files:
        - path: config/flash_config.h
        - path: config/boot_config.h
        - path: config/version.h
      folders: []
    - name: Drivers
      files:
        - path: drivers/usart/usart.c
        - path: drivers/flash/flash.c
        - path: drivers/crc32/crc32.c
      folders: []
    - name: Protocols
      files:
        - path: protocols/ymodem/ymodem.c
        - path: protocols/ymodem/crc16.c
      folders: []
    - name: App
      files:
        - path: app/boot.c
        - path: app/updater.c
      folders: []
    - name: Modules
      files:
        - path: modules/led/led.c
        - path: modules/key/key.c
        - path: modules/systick/systick.c
      folders: []
    - name: CMSIS
      files:
        - path: libraries/cmsis/startup/startup_stm32f40_41xxx.s
        - path: libraries/cmsis/system/system_stm32f4xx.c
      folders: []
    - name: StdPeriph
      files:
        - path: libraries/stdperiph/src/misc.c
        - path: libraries/stdperiph/src/stm32f4xx_gpio.c
        - path: libraries/stdperiph/src/stm32f4xx_rcc.c
        - path: libraries/stdperiph/src/stm32f4xx_usart.c
        - path: libraries/stdperiph/src/stm32f4xx_flash.c
        - path: libraries/stdperiph/src/stm32f4xx_dma.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 4f7a9c2b5e1d4a8f9c3b6d0e2f1a8c7d
targets:
  bootloader:
    cppPreprocessAttrs:
      defineList:
        - STM32F411xE
        - USE_STDPERIPH_DRIVER
      incList:
        - core
        - config
        - drivers/usart
        - drivers/flash
        - drivers/crc32
        - protocols/ymodem
        - app
        - modules/board
        - modules/led
        - modules/key
        - modules/systick
        - modules/bootapi
        - libraries/cmsis/inc
        - libraries/cmsis/system
        - libraries/stdperiph/inc
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks:
            - name: "[Generate bin]"
              abortAfterFailed: true
              command: fromelf --bin build/bootloader/bootloader.axf --output build/bootloader/Bootloader.bin
              disable: false
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: unspecified
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x04000"
                startAddr: "0x8000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x8000000"
        bin: ""
        elFile: None
        optionBytes: .eide/bootloader.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
